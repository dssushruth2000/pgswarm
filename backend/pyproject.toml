[project]
name = "optimizer"
version = "0.1.0"
description = "Adversarial PostgreSQL index optimizer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "sqlglot>=25.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
